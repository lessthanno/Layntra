<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layntra connection control</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #ffffff);
        --text: var(--figma-color-text, #1e1e1e);
        --muted: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #d9d9d9);
        --brand: #5551ff;
        --success: #138a62;
        --warning: #c26a16;
        --idle: #8a8a8a;
        --danger: #d14343;
        --radius: 14px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 6px;
        color: var(--text);
        background: transparent;
        font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      p { margin: 0; }

      .panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        height: 52px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg);
        box-shadow: 0 6px 18px rgb(0 0 0 / 16%);
      }

      .status {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
        height: 100%;
        padding: 0 12px;
      }

      .status[data-state="connecting"] strong { color: var(--warning); }
      .status[data-state="connected"] strong { color: var(--success); }
      .status[data-state="unavailable"] strong { color: var(--danger); }

      .status strong { display: block; font-size: 12px; }
      .status p {
        margin-top: 2px;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .control {
        display: grid;
        width: 54px;
        height: 44px;
        margin-right: 4px;
        place-items: center;
        border-radius: 10px;
        background: var(--figma-color-bg-secondary, #f3f3f3);
      }

      .control-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .switch {
        position: relative;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .switch::before {
        content: "";
        position: absolute;
        top: 13px;
        right: 6px;
        bottom: 13px;
        left: 6px;
        border-radius: 999px;
        background: var(--idle);
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 15px;
        left: 8px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgb(0 0 0 / 28%);
        transition: transform 140ms ease;
      }

      .switch[aria-checked="true"]::before { background: var(--brand); }
      .switch[aria-checked="true"]::after { transform: translateX(16px); }
      .switch:disabled { cursor: wait; opacity: .55; }

      :focus-visible { outline: 3px solid #8d8aff; outline-offset: 2px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <section class="panel" aria-label="Layntra for Figma connection">
      <div id="connection-status" class="status" data-state="loading" aria-live="polite" aria-atomic="true">
        <strong id="connection-title">Layntra</strong>
        <p id="connection-detail">Loading local connection</p>
      </div>

      <div class="control">
        <span id="auto-connect-label" class="control-label">Auto-connect</span>
        <button
          id="connection-toggle"
          class="switch"
          type="button"
          role="switch"
          aria-checked="false"
          aria-labelledby="auto-connect-label"
          title="Auto-connect"
          disabled
        ></button>
      </div>
    </section>

    <script>
      const stateCopy = {
        loading: ["Layntra", "Loading local connection"],
        off: ["Connection off", "Auto-connect disabled"],
        connecting: ["Connecting locally", "127.0.0.1:3846"],
        connected: ["Connected locally", "Layntra MCP · local only"],
        unavailable: ["Bridge unavailable", "Retrying locally · no fallback"]
      };

      const statusElement = document.getElementById("connection-status");
      const titleElement = document.getElementById("connection-title");
      const detailElement = document.getElementById("connection-detail");
      const toggleElement = document.getElementById("connection-toggle");

      let state = "loading";
      let connectionEnabled = false;
      let preferenceLoaded = false;
      let bridge = null;
      let retryTimer = null;
      let retryAttempt = 0;

      function render() {
        const [title, detail] = stateCopy[state];
        statusElement.dataset.state = state;
        titleElement.textContent = title;
        detailElement.textContent = detail;
        toggleElement.disabled = !preferenceLoaded;
        toggleElement.setAttribute("aria-checked", String(connectionEnabled));
      }

      function setState(nextState) {
        state = nextState;
        render();
      }

      function stopBridge() {
        clearTimeout(retryTimer);
        retryTimer = null;
        retryAttempt = 0;
        const activeBridge = bridge;
        bridge = null;
        if (activeBridge) {
          if (activeBridge.readyState === WebSocket.OPEN) {
            activeBridge.send(JSON.stringify({ type: "connection-preference", enabled: false }));
          }
          activeBridge.onclose = null;
          activeBridge.onerror = null;
          activeBridge.close();
        }
      }

      function scheduleReconnect() {
        if (!connectionEnabled) return;
        setState("unavailable");
        const delay = Math.min(1000 * (2 ** retryAttempt), 8000);
        retryAttempt += 1;
        retryTimer = setTimeout(connectBridge, delay);
      }

      function connectBridge() {
        if (!preferenceLoaded || !connectionEnabled) return;
        if (bridge) return;
        clearTimeout(retryTimer);
        retryTimer = null;
        setState("connecting");

        const socket = new WebSocket("ws://localhost:3846");
        bridge = socket;
        socket.onopen = () => {
          if (bridge !== socket || !connectionEnabled) return;
          retryAttempt = 0;
          setState("connected");
          socket.send(JSON.stringify({ type: "hello", client: "layntra-figma" }));
        };
        socket.onclose = () => {
          if (bridge !== socket) return;
          bridge = null;
          scheduleReconnect();
        };
        socket.onerror = () => socket.close();
        socket.onmessage = (event) => {
          let incoming;
          try {
            incoming = JSON.parse(event.data);
          } catch {
            return;
          }
          if (
            incoming?.type === "command" &&
            typeof incoming.requestId === "string" &&
            typeof incoming.command === "string" &&
            (!incoming.args || typeof incoming.args === "object")
          ) {
            parent.postMessage({ pluginMessage: {
              type: "mcp-command",
              requestId: incoming.requestId,
              command: incoming.command,
              args: incoming.args || {}
            } }, "*");
          }
        };
      }

      function setConnectionEnabled(enabled, persist) {
        connectionEnabled = enabled;
        if (persist) {
          parent.postMessage({ pluginMessage: {
            type: "connection-preference-changed",
            enabled
          } }, "*");
        }
        if (enabled) {
          connectBridge();
        } else {
          stopBridge();
          setState("off");
        }
        render();
      }

      toggleElement.onclick = () => setConnectionEnabled(!connectionEnabled, true);

      onmessage = (event) => {
        const incoming = event.data.pluginMessage;
        if (!incoming || typeof incoming !== "object") return;

        if (incoming.type === "connection-preference") {
          const wasLoaded = preferenceLoaded;
          preferenceLoaded = true;
          const enabled = incoming.enabled !== false;
          if (!wasLoaded || enabled !== connectionEnabled) {
            setConnectionEnabled(enabled, false);
          } else {
            render();
          }
          return;
        }
        if (incoming.type === "mcp-result" && bridge?.readyState === WebSocket.OPEN) {
          bridge.send(JSON.stringify(incoming));
        }
      };

      render();
      parent.postMessage({ pluginMessage: { type: "connection-preference-requested" } }, "*");
    </script>
  </body>
</html>
